# Example complete metadata block:

example:
  title: "Debug CUDA Out-of-Memory in Multi-GPU Training"
  date: "2026-07-15"
  author: "Ryukijano"
  tools: ["Cursor", "Claude Sonnet 4.5"]
  topics: ["debugging", "pytorch", "multi-gpu", "memory-optimization"]
  technologies: ["PyTorch", "CUDA", "DDP", "NCCL"]
  hardware: ["A100", "DGX"]
  outcome: "success"
  duration: "45 minutes"
  key_insights:
    - "Gradient accumulation needs explicit zero_grad() between steps"
    - "Use gradient checkpointing for memory-intensive models"
    - "Monitor CUDA memory fragmentation with torch.cuda.memory_stats()"
  related_conversations:
    - "conversations/infrastructure/dgx-setup.md"
  external_resources:
    - url: "https://pytorch.org/docs/stable/notes/ddp.html"
      title: "PyTorch DDP Best Practices"
